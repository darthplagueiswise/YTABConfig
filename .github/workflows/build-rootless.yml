name: Build YTABConfig (sideload and rootless)

on:
  workflow_dispatch:
    inputs:
      build_dylib:
        description: Build the standalone dylib and sideload bundle
        required: false
        default: true
        type: boolean
      build_rootless:
        description: Build the rootless deb
        required: false
        default: true
        type: boolean
      upload_artifacts:
        description: Upload build artifacts
        required: false
        default: true
        type: boolean
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build YTABConfig
    runs-on: macos-latest
    env:
      SDK_NAME: iPhoneOS26.2.sdk
      BUILD_DYLIB: ${{ github.event_name != 'workflow_dispatch' || inputs.build_dylib }}
      BUILD_ROOTLESS: ${{ github.event_name != 'workflow_dispatch' || inputs.build_rootless }}
      UPLOAD_ARTIFACTS: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_artifacts }}

    steps:
      - name: Validate build selection
        run: |
          if [ "$BUILD_DYLIB" != "true" ] && [ "$BUILD_ROOTLESS" != "true" ]; then
            echo "::error::Select at least one build variant."
            exit 1
          fi

      - name: Checkout YTABConfig
        uses: actions/checkout@v4
        with:
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: brew install ldid dpkg make

      - name: Prefer GNU Make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iOS SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/${{ env.SDK_NAME }}
          key: ytabconfig-${{ runner.os }}-${{ runner.arch }}-${{ env.SDK_NAME }}-v1

      - name: Download iOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout --quiet
          mkdir -p "$THEOS/sdks"
          mv "$SDK_NAME" "$THEOS/sdks/"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install private headers
        run: |
          mkdir -p "$THEOS/include"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git \
            "$THEOS/include/PSHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git \
            "$THEOS/include/YouTubeHeader"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Run contract tests
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          cd main
          bash Tests/runtime_registry_static_check.sh
          bash Tests/app_catalog_export_static_check.sh
          bash scripts/package_metadata_static_check.sh
          bash scripts/polished_ui_static_check.sh
          PYTHONPATH="$PWD" python -m unittest discover -s tests -t . -v

      - name: Read package version
        id: version
        run: |
          VERSION="$(awk '$1 == "Version:" { print $2; exit }' main/control)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build standalone dylib for sideload injection
        if: env.BUILD_DYLIB == 'true'
        run: |
          cd main
          rm -rf .theos packages release/sideload
          make clean
          make FINALPACKAGE=1 DEBUG=0 SIDELOAD=1

          DYLIB="$(find .theos/obj -type f -name YTABConfig.dylib -print -quit)"
          test -n "$DYLIB"

          mkdir -p release/sideload
          cp "$DYLIB" "release/YTABConfig_v${VERSION}.dylib"
          cp "$DYLIB" release/sideload/YTABConfig.dylib
          cp -R "layout/Library/Application Support/YTABC.bundle" \
            release/sideload/YTABC.bundle

          strip -x -S "release/YTABConfig_v${VERSION}.dylib" || true
          ldid -S "release/YTABConfig_v${VERSION}.dylib"
          cp "release/YTABConfig_v${VERSION}.dylib" \
            release/sideload/YTABConfig.dylib

          test "$(lipo -archs "release/YTABConfig_v${VERSION}.dylib")" = "arm64"
          file "release/YTABConfig_v${VERSION}.dylib"
          otool -L "release/YTABConfig_v${VERSION}.dylib"
          plutil -lint release/sideload/YTABC.bundle/Info.plist

          (
            cd release/sideload
            zip -qry "../YTABConfig_v${VERSION}_sideload.zip" .
          )
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build rootless deb
        if: env.BUILD_ROOTLESS == 'true'
        run: |
          cd main
          rm -rf .theos packages
          make clean
          make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=rootless

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          mkdir -p release
          cp "$DEB" "release/YTABConfig_${VERSION}_rootless.deb"

          test "$(dpkg-deb -f "release/YTABConfig_${VERSION}_rootless.deb" Architecture)" = \
            "iphoneos-arm64"
          dpkg-deb -c "release/YTABConfig_${VERSION}_rootless.deb" | \
            grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/YTABConfig.dylib'
          dpkg-deb -c "release/YTABConfig_${VERSION}_rootless.deb" | \
            grep -q 'var/jb/Library/Application Support/YTABC.bundle/Info.plist'
          dpkg-deb -I "release/YTABConfig_${VERSION}_rootless.deb"
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

      - name: Upload sideload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true' && env.BUILD_DYLIB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YTABConfig_v${{ steps.version.outputs.version }}_sideload
          path: |
            main/release/YTABConfig_v${{ steps.version.outputs.version }}.dylib
            main/release/YTABConfig_v${{ steps.version.outputs.version }}_sideload.zip
          if-no-files-found: error

      - name: Upload rootless deb
        if: env.UPLOAD_ARTIFACTS == 'true' && env.BUILD_ROOTLESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YTABConfig_${{ steps.version.outputs.version }}_rootless
          path: main/release/YTABConfig_${{ steps.version.outputs.version }}_rootless.deb
          if-no-files-found: error
