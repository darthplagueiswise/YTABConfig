name: Build YTABConfig (rootless, dylib, and Feather)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTABConfig
    runs-on: macos-latest
    permissions:
      contents: read
      statuses: write

    env:
      SDK_NAME: iPhoneOS26.2.sdk

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install YTABConfig headers
        run: |
          mkdir -p "$THEOS/include"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git \
            "$THEOS/include/PSHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git \
            "$THEOS/include/YouTubeHeader"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate contracts
        run: |
          cd main
          chmod +x build.sh
          bash -n build.sh
          bash Tests/runtime_registry_static_check.sh
          bash Tests/employee_experiments_static_check.sh
          bash Tests/app_catalog_export_static_check.sh
          bash scripts/package_metadata_static_check.sh
          bash scripts/polished_ui_static_check.sh
          python3 -m venv "$RUNNER_TEMP/ytab-tests-venv"
          "$RUNNER_TEMP/ytab-tests-venv/bin/python" -m pip install --disable-pip-version-check jsonschema
          "$RUNNER_TEMP/ytab-tests-venv/bin/python" -m unittest discover -s tests -v
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build rootless and report exact compiler error
        run: |
          cd main
          set +e
          ./build.sh rootless > "$RUNNER_TEMP/ytab-rootless-build.log" 2>&1
          BUILD_STATUS=$?
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            ERROR_SUMMARY="$(grep -E '(^|[[:space:]])(fatal )?error:' "$RUNNER_TEMP/ytab-rootless-build.log" | tail -n 1 | sed -E 's/^[^:]+:[0-9]+:[0-9]+: //' | tr '\n\r' '  ' | cut -c1-82)"
            if [ -z "$ERROR_SUMMARY" ]; then
              ERROR_SUMMARY="rootless build failed without a parsed clang error"
            fi
            echo "::error::$ERROR_SUMMARY"
            STATUS_JSON="$(python3 - "$ERROR_SUMMARY" <<'PY'
          import json, sys
          print(json.dumps({
              "state": "error",
              "context": "compiler:" + sys.argv[1],
              "description": "rootless compiler failure",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          }))
          PY
            )"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$STATUS_JSON"
            cat "$RUNNER_TEMP/ytab-rootless-build.log"
            exit "$BUILD_STATUS"
          fi
          cat "$RUNNER_TEMP/ytab-rootless-build.log"
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failed rootless build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: YTABConfig_rootless_failure_log
          path: ${{ runner.temp }}/ytab-rootless-build.log
          if-no-files-found: error
